<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Patrimonium</title>

  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json"/>
  <meta name="theme-color" content="#0A0B0E"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Patrimonium"/>
  <link rel="apple-touch-icon" href="/static/icon-192.png"/>

  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>

<!-- ══════════════════════════════════
     AUTH SCREEN
     ══════════════════════════════════ -->
<div id="authScreen" class="auth-screen" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">◈</div>
      <div class="auth-logo-name">Patrimonium</div>
      <div class="auth-logo-sub">Gestion de patrimoine</div>
    </div>

    <!-- Step 1: email + password -->
    <div id="authStepLogin" class="auth-step active">
      <div class="auth-title">Connexion</div>
      <form id="loginForm" onsubmit="submitLogin(event)">
        <div class="form-group" style="margin-bottom:14px">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="loginEmail" placeholder="admin@example.com" required autocomplete="email"/>
        </div>
        <div class="form-group" style="margin-bottom:20px">
          <label class="form-label">Mot de passe</label>
          <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required autocomplete="current-password"/>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center" id="loginBtn">Se connecter</button>
      </form>
    </div>

    <!-- Step 2: 2FA code -->
    <div id="authStep2FA" class="auth-step">
      <div class="auth-title">Vérification 2FA</div>
      <p style="color:var(--text-secondary);font-size:13px;margin-bottom:20px;text-align:center">Saisissez le code de votre application d'authentification.</p>
      <form id="twoFAForm" onsubmit="submit2FA(event)">
        <div class="form-group" style="margin-bottom:20px">
          <label class="form-label">Code à 6 chiffres</label>
          <input type="text" class="form-input" id="totpCode" placeholder="000000" maxlength="8" inputmode="numeric" autocomplete="one-time-code" style="text-align:center;font-family:var(--font-display);font-size:22px;letter-spacing:.3em"/>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Vérifier</button>
        <button type="button" class="btn btn-secondary" style="width:100%;justify-content:center;margin-top:8px" onclick="showAuthStep('login')">← Retour</button>
      </form>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════
     APP SHELL (shown when authenticated)
     ══════════════════════════════════ -->
<div id="appShell" class="app" style="display:none">

  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="header-inner">
        <a class="logo" href="#" onclick="navigate('dashboard')">
          <div class="logo-icon">◈</div>
          Patrimonium
        </a>

        <nav class="nav" id="mainNav">
          <button class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
            <span class="nav-icon">⬡</span> <span>Tableau de bord</span>
          </button>
          <button class="nav-item" data-page="portfolio" onclick="navigate('portfolio')">
            <span class="nav-icon">📈</span> <span>Portefeuille</span>
          </button>
          <button class="nav-item" data-page="coffres" onclick="navigate('coffres')">
            <span class="nav-icon">🏦</span> <span>Coffres</span>
          </button>
          <button class="nav-item" data-page="assets" onclick="navigate('assets')">
            <span class="nav-icon">💎</span> <span>Actifs physiques</span>
          </button>
          <button class="nav-item" data-page="reserves" onclick="navigate('reserves')">
            <span class="nav-icon">🏦</span> <span>Réserves</span>
          </button>
          <button class="nav-item" data-page="passwords" onclick="navigate('passwords')">
            <span class="nav-icon">🔐</span> <span>Coffre mots de passe</span>
          </button>
          <button class="nav-item admin-only" data-page="admin" onclick="navigate('admin')" style="display:none">
            <span class="nav-icon">⚙️</span> <span>Admin</span>
          </button>
        </nav>

        <div class="header-right">
          <span class="last-update" id="lastUpdate">—</span>
          <div class="live-badge offline" id="liveBadge">
            <div class="live-dot"></div>
            <span id="liveText">OFFLINE</span>
          </div>
          <button class="refresh-btn" id="globalRefreshBtn" onclick="globalRefresh()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M3 12a9 9 0 019-9 9.75 9.75 0 016.74 2.74L21 8"/><path d="M21 3v5h-5M21 12a9 9 0 01-9 9 9.75 9.75 0 01-6.74-2.74L3 16"/>
            </svg>
            Actualiser
          </button>
          <button class="user-btn" id="userMenuBtn" onclick="toggleUserMenu()">
            <span id="userNameHeader">—</span> ▾
          </button>
        </div>
      </div>
    </div>

    <!-- User dropdown -->
    <div id="userDropdown" style="display:none;position:absolute;top:60px;right:24px;background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:8px;min-width:200px;z-index:200;box-shadow:var(--shadow)">
      <div style="padding:8px 12px;border-bottom:1px solid var(--border);margin-bottom:4px">
        <div style="font-size:13px;font-weight:500" id="ddUserName">—</div>
        <div style="font-size:11px;color:var(--text-secondary)" id="ddUserEmail">—</div>
      </div>
      <button class="nav-item" style="width:100%;justify-content:flex-start" onclick="openProfileModal()">👤 Mon profil &amp; 2FA</button>
      <button class="nav-item" style="width:100%;justify-content:flex-start;color:var(--accent-red)" onclick="logout()">⬡ Déconnexion</button>
    </div>
  </header>

  <!-- Pages -->
  <main class="main">
    <div class="container">
      <div id="page-dashboard" class="page active"></div>
      <div id="page-portfolio" class="page"></div>
      <div id="page-coffres" class="page"></div>
      <div id="page-assets" class="page"></div>
      <div id="page-reserves" class="page"></div>
      <div id="page-passwords" class="page"></div>
      <div id="page-admin" class="page"></div>
    </div>
  </main>
</div>

<div class="toast-container" id="toastContainer"></div>

<!-- ═══════════════════════════════ MODALS ═══════════════════════════════ -->

<!-- Profile / 2FA Modal -->
<div class="modal-overlay" id="profileModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Mon profil</span>
      <button class="modal-close" onclick="closeModal('profileModal')">✕</button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('profileTabs','profile')">Profil</button>
      <button class="tab-btn" onclick="switchTab('profileTabs','twofa')">2FA</button>
      <button class="tab-btn" onclick="switchTab('profileTabs','password')">Mot de passe</button>
    </div>
    <!-- Profile tab -->
    <div class="tab-panel active" id="tab-profile">
      <div style="color:var(--text-secondary);font-size:13px" id="profileInfo">Chargement…</div>
    </div>
    <!-- 2FA tab -->
    <div class="tab-panel" id="tab-twofa">
      <div id="twoFAPanel">Chargement…</div>
    </div>
    <!-- Change password tab -->
    <div class="tab-panel" id="tab-password">
      <form onsubmit="submitChangePassword(event)" class="form-grid" style="grid-template-columns:1fr">
        <div class="form-group"><label class="form-label">Mot de passe actuel</label><input type="password" class="form-input" id="oldPassword"/></div>
        <div class="form-group"><label class="form-label">Nouveau mot de passe</label><input type="password" class="form-input" id="newPassword"/></div>
        <div class="form-actions" style="border-top:none;padding-top:0;margin-top:8px">
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Generic confirm modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal" style="max-width:380px">
    <div class="modal-header">
      <span class="modal-title" id="confirmTitle">Confirmer</span>
      <button class="modal-close" onclick="closeModal('confirmModal')">✕</button>
    </div>
    <p style="color:var(--text-secondary);font-size:13px;margin-bottom:24px" id="confirmMessage"></p>
    <div class="form-actions" style="border-top:none;margin-top:0;padding-top:0">
      <button class="btn btn-secondary" onclick="closeModal('confirmModal')">Annuler</button>
      <button class="btn btn-danger" id="confirmBtn">Supprimer</button>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
<script src="/static/utils.js"></script>
<script src="/static/charts.js"></script>
<script src="/static/auth.js"></script>
<script src="/static/dashboard.js"></script>
<script src="/static/portfolio.js"></script>
<script src="/static/coffres.js"></script>
<script src="/static/assets.js"></script>
<script src="/static/reserves.js"></script>
<script src="/static/passwords.js"></script>
<script src="/static/admin.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
